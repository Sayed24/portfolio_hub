<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="styles.css">
</head>

<body>
<main id="case"></main>

<script>
async function loadCase(){
 const id=new URLSearchParams(location.search).get("id");

 const res=await fetch("projects.json");
 const data=await res.json();

 const project=data.find(p=>p.id==id);

 document.getElementById("case").innerHTML=`
   <h1>${project.title}</h1>
   <img src="${project.image}" style="width:100%;max-width:800px">
   <p>${project.description}</p>

   <h3>AI Case Study</h3>
   <p>
   Architecture, performance optimization, accessibility,
   recruiter-focused UX decisions, and scalable frontend structure.
   </p>
 `;
}
loadCase();
</script>

</body>
</html>
