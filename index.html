<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Portfolio Hub</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="css/style.css">
  <link rel="manifest" href="manifest.json">
</head>

<body>

<header>
  <h1> <a href="#"> Portfolio Hub </a></h1>

  <div class="controls">
    <input id="search" placeholder="Search projects...">
    <button id="themeToggle">🌙</button>
    <button id="recruiterBtn">Recruiter</button>
    <button id="dashboardBtn">Analytics</button>
  </div>
</header>
<section class="hero">
  <div class="hero-content">

    <h1>
      Building Modern Web Experiences
    </h1>

    <p>
      Welcome to my Portfolio Hub. Here you can explore my projects, 
      real-world applications, and work from GitHub — all built with modern web technologies.
    </p>

    <div class="hero-buttons">
      <button id="viewProjectsBtn">View Projects</button>
      <a href="https://github.com/YOUR_USERNAME" target="_blank">
        <button class="secondary">GitHub</button>
      </a>
    </div>

  </div>
</section>
<main id="app"></main>

<!-- Chat -->
<button id="chatBtn">💬</button>

<div id="chatBox">
  <div class="chat-header">AI Recruiter</div>
  <div id="messages"></div>
  <input id="chatInput" placeholder="Ask about skills...">
</div>

<script src="js/app.js"></script>

</body>
</html>
