<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Portfolio Hub — Projects</title>

<meta name="description" content="Frontend Developer | Dashboard Systems | PWA Developer Portfolio">

<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="styles.css">

<meta property="og:title" content="Developer Portfolio">
<meta property="og:description" content="Modern projects portfolio">
<meta property="og:image" content="icons/icon-512.png">

</head>

<body>

<div id="cursor"></div>

<header class="nav">
  <h1>Portfolio</h1>

  <div class="nav-actions">
    <button id="searchBtn">⌘K</button>
    <button id="modeToggle">🌙</button>
  </div>
</header>

<section class="hero">
  <h2>Selected Projects</h2>
  <p>Frontend • Dashboards • PWAs • Admin Systems</p>
</section>

<main id="projects" class="grid"></main>

<!-- Command Palette -->
<div id="commandPalette" class="palette hidden">
  <input id="searchInput" placeholder="Search projects..." />
  <div id="results"></div>
</div>

<!-- Recruiter Heatmap -->
<section id="analyticsPanel" class="analytics hidden">
  <h3>Recruiter View</h3>
  <canvas id="heatmap"></canvas>
</section>

<script src="app.js"></script>
</body>
</html>
