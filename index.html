<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Portfolio Hub</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="css/style.css">
  <link rel="manifest" href="manifest.json">
</head>

<body>

<header>
  <h1> <a href="#"> Portfolio Hub </a></h1>

  <div class="controls">
    <input id="search" placeholder="Search projects...">
    <button id="themeToggle">🌙</button>
    <button id="recruiterBtn">Recruiter</button>
    <button id="dashboardBtn">Analytics</button>
  </div>
</header>

<main id="app"></main>

<!-- Chat -->
<button id="chatBtn">💬</button>

<div id="chatBox">
  <div class="chat-header">AI Recruiter</div>
  <div id="messages"></div>
  <input id="chatInput" placeholder="Ask about skills...">
</div>

<script src="js/app.js"></script>

</body>
</html>
