<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Portfolio Hub</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="css/style.css">
  <link rel="manifest" href="manifest.json">
</head>

<body>

<header>
  <h1> Portfolio Hub</h1>

  <div class="controls">
    <input id="search" placeholder="Search projects...">
    <button id="themeToggle">🌙</button>
    <button id="recruiterBtn">Recruiter</button>
    <button id="dashboardBtn">Analytics</button>
  </div>
</header>
<section class="hero">

  <div class="hero-bg"></div>

  <div class="hero-content">

    <h1 id="heroTitle">Crafting Modern Web Applications</h1>

    <p>
      This portfolio showcases dynamic web applications, modern UI systems, 
      and real-world projects built with scalable frontend architecture.
    </p>

    <div class="hero-buttons">
      <button id="viewProjectsBtn">Explore Projects</button>
      <a href="https://github.com/YOUR_USERNAME" target="_blank">
        <button class="secondary">GitHub</button>
      </a>
    </div>

    <!-- STATS -->
    <div class="hero-stats">
      <div>
        <h3>20+</h3>
        <p>Projects</p>
      </div>
      <div>
        <h3>10+</h3>
        <p>Technologies</p>
      </div>
      <div>
        <h3>100%</h3>
        <p>Responsive</p>
      </div>
    </div>

  </div>
</section>
<main id="app"></main>

<!-- Chat -->
<button id="chatBtn">💬</button>

<div id="chatBox">
  <div class="chat-header">AI Recruiter</div>
  <div id="messages"></div>
  <input id="chatInput" placeholder="Ask about skills...">
</div>

<script src="js/app.js"></script>

</body>
</html>
