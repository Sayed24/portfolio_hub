<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portfolio Hub</title>

<link rel="stylesheet" href="css/style.css">
<link rel="manifest" href="manifest.json">

</head>

<body>

<header>
  <h1>Portfolio Hub</h1>

  <div class="controls">
    <input type="text" id="search" placeholder="Search...">
    <button id="themeToggle">🌙</button>
    <button id="recruiterBtn">Recruiter</button>
    <button id="dashboardBtn">Analytics</button>
  </div>
</header>

<main id="app"></main>

<button id="chatBtn">💬</button>

<div id="chatBox">
  <div class="chat-header">AI Recruiter</div>
  <div id="messages"></div>
  <input id="chatInput" placeholder="Ask something...">
</div>

<script src="js/app.js"></script>

</body>
</html>
